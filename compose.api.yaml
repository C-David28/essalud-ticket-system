services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: ./apps/api/.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      SWAGGER_ENABLED: "false"
      API_CONTAINER_NETWORK: "true"
    # El adaptador de arranque solo cambia los hosts/puertos de las URLs al entorno Compose.
    command: [node, apps/api/dist/container.js]
    ports: ["127.0.0.1:3001:3001"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [backend]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 15s
