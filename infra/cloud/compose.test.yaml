services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: bootstrap_admin
      POSTGRES_PASSWORD: ${CLOUD_TEST_ADMIN_PASSWORD:?Generated by cloud-integration.mjs}
      POSTGRES_DB: cloud_test
    networks:
      default:
        aliases: [postgres.railway.internal]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U bootstrap_admin -d cloud_test']
      interval: 2s
      timeout: 2s
      retries: 30
    volumes: [pg_data:/var/lib/postgresql/data]
  ops:
    build:
      context: ../..
      dockerfile: infra/cloud/Dockerfile.ops
    environment:
      CLOUD_ADMIN_DATABASE_URL: postgresql://bootstrap_admin:${CLOUD_TEST_ADMIN_PASSWORD}@postgres.railway.internal:5432/cloud_test
      CLOUD_DATABASE_NAME: cloud_test
      CLOUD_RUNTIME_PASSWORD: ${CLOUD_TEST_RUNTIME_PASSWORD:?Generated by cloud-integration.mjs}
    volumes: [backups:/backups]
volumes:
  pg_data:
  backups:
