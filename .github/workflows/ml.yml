name: ML Preparation CI

on:
  push:
    branches: [main]
    paths:
      - 'ml/**'
      - 'apps/api/src/domain/ticket.ts'
      - 'package.json'
      - '.github/workflows/ml.yml'
  pull_request:
    paths:
      - 'ml/**'
      - 'apps/api/src/domain/ticket.ts'
      - 'package.json'
      - '.github/workflows/ml.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preparation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            ml/colab/requirements.txt
            ml/modeling/requirements.txt
      - name: Verify immutable Dataset V1 and validator
        run: |
          npm run ml:data:check
          npm run ml:data:test
      - name: Verify clean notebook and safe loaders
        run: |
          npm run ml:colab:check
          python -B -m unittest discover -s ml/test -p test_colab.py -v
          npm run ml:experiment:check
          npm run ml:model:notebook:check
      - name: Execute notebook with isolated dependencies and local snapshot
        run: python -B ml/colab/smoke_notebook.py --workspace "$RUNNER_TEMP/ml-stage-4.3"
      - name: Verify grouped experiment and development notebook (final test locked)
        run: |
          "$RUNNER_TEMP/ml-stage-4.3/.venv/bin/python" -B -m unittest discover -s ml/test -p test_experiment.py -v
          python -B ml/experimentation/smoke_notebook.py --workspace "$RUNNER_TEMP/ml-stage-4.4"
      - name: Verify approved model and reproduce stage 4.5 (no final-test evaluation)
        run: |
          python -B ml/modeling/bootstrap.py --workspace "$RUNNER_TEMP/ml-stage-4.5"
          "$RUNNER_TEMP/ml-stage-4.5/.venv/bin/python" -B ml/modeling/release.py --phase check
          "$RUNNER_TEMP/ml-stage-4.5/.venv/bin/python" -B -m unittest discover -s ml/test -p test_model.py -v
          python -B ml/modeling/smoke_notebook.py --workspace "$RUNNER_TEMP/ml-stage-4.5" --no-install
      - uses: actions/upload-artifact@v4
        with:
          name: stage-4.3-readiness-ci
          path: ${{ runner.temp }}/ml-stage-4.3/outputs/stage-4.3-readiness.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: stage-4.5-reproduction-ci
          path: |
            ${{ runner.temp }}/ml-stage-4.5/rebuilt-model-v1/metadata.json
            ${{ runner.temp }}/ml-stage-4.5/rebuilt-model-v1/verification.json
            ${{ runner.temp }}/ml-stage-4.5/rebuilt-model-v1/build-receipt.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: stage-4.4-development-ci
          path: |
            ${{ runner.temp }}/ml-stage-4.4/results/comparison.json
            ${{ runner.temp }}/ml-stage-4.4/results/selection.json
            ${{ runner.temp }}/ml-stage-4.4/results/comparison.png
          if-no-files-found: error
          retention-days: 7
