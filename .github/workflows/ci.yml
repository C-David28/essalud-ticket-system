name: Infrastructure CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate and build API
        run: |
          npm run api:validate
          npm run api:build
          npm run api:test
      - name: Validate scripts
        run: |
          npm run check
          npm run cloud:test
      - name: Build and verify user portal and technician board
        run: |
          npm run web:build
          npm run web:check
          npm run web:test
          npm run web:smoke
      - name: Generate ephemeral credentials
        run: npm run env:init
      - name: Validate Compose
        run: npm run infra:config
      - name: Start infrastructure and await readiness
        run: npm run infra:up
      - name: Verify SQL and Redis authentication
        run: npm run infra:check
      - name: Verify pre-migration backup
        run: npm run db:backup
      - name: Apply multi-tenant migration
        run: npm run db:migrate
      - name: Verify migration can be repeated
        run: npm run db:migrate
      - name: Verify tenant isolation and database constraints
        run: npm run db:check
      - name: Verify transactional append-only audit
        run: npm run db:audit:check
      - name: Verify tickets SQL
        run: |
          npm run db:tickets:check
          npm run db:ticket-states:check
          npm run db:ticket-assignment:check
          npm run db:organization:check
          npm run db:access:check
          npm run db:geography:check
      - name: Show migration history
        run: npm run db:status
      - name: Provision runtime credentials (repeatable)
        run: |
          npm run api:setup
          npm run api:setup
      - name: Integration in disposable infrastructure
        run: npm run api:test:integration
      - name: Validate and run API container
        run: |
          docker compose -f compose.yaml -f compose.api.yaml config --quiet
          npm run api:up
          npm run api:check
      - name: Verify local ticket API in Docker
        run: |
          npm run tickets:setup
          npm run tickets:setup
          npm run demo:data:check
          npm run tickets:up
          npm run tickets:check
      - name: Verify local real-time demonstration
        run: |
          npm run demo:config
          npm run demo:up
          npm run demo:check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify assisted category integration and manual fallback
        run: |
          npm run ml:policy:check
          npm run ml:integration:test
          npm run ml:service:setup
          npm run ml:integration:setup
          git check-ignore ml/outputs/integration.env
          npm run ml:integration:config
          npm run ml:integration:up
          npm run ml:integration:check
          npm run ml:integration:stop-ml
          npm run ml:integration:check -- --unavailable
          npm run ml:integration:start-ml
          npm run demo:check
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: stage-4.7-integration-check
          path: ml/outputs/integration*-check.json
          if-no-files-found: error
          retention-days: 7
      - name: Verify cloud operations and backup restoration
        run: npm run cloud:test:integration
      - name: Service status
        if: failure()
        run: |
          docker compose -f compose.yaml -f compose.api.yaml ps -a
          if [ -f ml/outputs/integration.env ]; then
            npm run ml:integration:logs
          fi
      - name: Stop infrastructure
        if: always()
        run: |
          if [ -f ml/outputs/integration.env ]; then
            npm run ml:integration:stop-ml
          fi
          if [ -f apps/api/.env ]; then
            docker compose -f compose.yaml -f compose.api.yaml down --volumes --remove-orphans
          elif [ -f .env ]; then
            docker compose down --volumes --remove-orphans
          fi
