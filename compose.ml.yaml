name: essalud-ml-local

services:
  ml:
    build:
      context: .
      dockerfile: ml/service/Dockerfile
    env_file:
      - ml/outputs/service.env
    environment:
      ML_HOST: 0.0.0.0
      PORT: "8001"
      ML_INFERENCE_TIMEOUT_SECONDS: "2"
      ML_STARTUP_TIMEOUT_SECONDS: "60"
    ports:
      - "127.0.0.1:8001:8001"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped
    stop_grace_period: 15s
